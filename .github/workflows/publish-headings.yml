name: Publish ansi-headings

# Bundles src/render/headings.ts (and its local deps: phrase.ts, primitives.ts,
# glyphs.json) standalone and publishes it as @tuomashatakka/ansi-headings to
# GitHub Packages. Independent of the plugin's git-based release process in
# release.yml - this package has its own version line.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (semver, no leading v) e.g. 1.0.0"
        required: true
        type: string
      prerelease:
        description: "npm dist-tag: publish as 'next' instead of 'latest'"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ansi-headings
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build bundle
        run: |
          mkdir -p packages/ansi-headings/dist
          bun build src/render/headings.ts \
            --outfile packages/ansi-headings/dist/index.js \
            --target node \
            --format esm \
            --external chalk

      - name: Publish
        uses: ./.github/actions/release-package
        with:
          version: ${{ inputs.version }}
          package-dir: "packages/ansi-headings"
          tag-prefix: "ansi-headings-v"
          create-git-tag: "false"
          create-github-release: "false"
          publish-npm: "true"
          npm-registry-url: "https://npm.pkg.github.com"
          npm-scope: "@tuomashatakka"
          npm-tag: ${{ inputs.prerelease && 'next' || 'latest' }}
          github-token: ${{ github.token }}
