name: Release

# Cut a versioned GitHub Release for the plugin.
# Distribution is git-based: users add this repo as a plugin marketplace
# (.claude-plugin/marketplace.json) and Claude Code fetches the tagged repo, so a
# "release" = bump version files -> rebuild dist/hooks.mjs -> commit -> tag ->
# GitHub Release. No npm publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 2.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release (does not become 'latest')"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Smoke test
        run: bun run smoke

      # The committed bundle is the shipped artifact. Refuse to tag a release
      # whose dist/hooks.mjs lags behind src/ - CI keeps main in sync, so a
      # mismatch here means something bypassed it.
      - name: Verify bundle is current
        run: |
          bun run build
          if ! git diff --quiet -- dist/hooks.mjs; then
            echo "::error::dist/hooks.mjs is stale. Run 'bun run build' and commit before releasing."
            exit 1
          fi

      - name: Release
        uses: ./.github/actions/release-package
        with:
          version: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          package-dir: "."
          extra-version-files: ".claude-plugin/plugin.json,.claude-plugin/marketplace.json"
          tag-prefix: "v"
          create-git-tag: "true"
          create-github-release: "true"
          publish-npm: "false"
          github-token: ${{ github.token }}
