name: Release

# Cut a versioned GitHub Release for the plugin.
# Distribution is git-based (installed via clone into ~/.claude/plugins/), so a
# "release" = bump version files -> commit -> tag -> GitHub Release. No npm publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 2.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release (does not become 'latest')"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Smoke test
        run: bun run smoke

      - name: Validate version input
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Invalid version '${{ inputs.version }}'. Expected semver like 2.1.0 or 2.1.0-rc.1"
            exit 1
          fi

      - name: Bump version files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' .claude-plugin/plugin.json > plugin.tmp && mv plugin.tmp .claude-plugin/plugin.json
          jq --arg v "$VERSION" '.version = $v' package.json > pkg.tmp && mv pkg.tmp package.json
          echo "plugin.json -> $(jq -r .version .claude-plugin/plugin.json)"
          echo "package.json -> $(jq -r .version package.json)"

      - name: Commit, tag, and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json package.json
          if git diff --cached --quiet; then
            echo "No version changes to commit (already at $VERSION)."
          else
            git commit -m "chore(release): v$VERSION"
          fi
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=(--title "v$VERSION" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "v$VERSION" "${FLAGS[@]}"
