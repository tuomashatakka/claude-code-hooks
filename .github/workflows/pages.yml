name: Deploy Pages

# Publishes the static showcase page in public/ to GitHub Pages. The
# terminal demo on that page (public/demo-data.js) is captured fresh from
# the real hook pipeline on every deploy - see scripts/capture-demo.ts -
# so it can't drift from what the hooks actually render.
# Repo Settings -> Pages -> Source must be set to "GitHub Actions" once.
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "hooks/**"
      - "packages/**"
      - "scripts/capture-demo.ts"
      - "scripts/ansi-to-html.ts"
      - "scripts/fixtures.ts"
      - "scripts/fixtures/**"
      - "scripts/smoke.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture live demo output
        run: bun run demo:capture

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
